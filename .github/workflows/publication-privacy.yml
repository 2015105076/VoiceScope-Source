name: Publication privacy

on: [push, pull_request]

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private data and credentials in files and history
        run: python3 scripts/check_publication.py
      - name: Verify privacy checks with synthetic fixtures
        run: python3 -m unittest discover -s tests -p test_publication_privacy.py -v
